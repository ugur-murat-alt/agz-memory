name: Bug report
description: Report a reproducible AGZ Memory defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, database content, session transcripts, or private paths.
  - type: input
    id: package-version
    attributes:
      label: AGZ Memory package and version
      placeholder: "@vaur94/agz-memory@0.5.1"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Bun and OpenCode versions
      placeholder: "Bun 1.3.14; OpenCode 0.0.0-beta-18743"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MCP server
        - Core or database
        - Admin CLI
        - OpenCode plugin
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Include sanitized steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include doctor output or errors only after removing sensitive data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, note content, transcripts, and private paths.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
