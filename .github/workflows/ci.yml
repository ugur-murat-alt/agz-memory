name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:verify
      - run: bun test
      - run: bun run check
      - run: bun run build
      - run: mkdir -p "$RUNNER_TEMP/agz-pack"
      - run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/agz-pack"
      - run: npm pack --json --pack-destination "$RUNNER_TEMP/agz-pack"
        working-directory: packages/opencode-plugin
      - name: Install packed packages together
        run: |
          mkdir -p "$RUNNER_TEMP/agz-install"
          cd "$RUNNER_TEMP/agz-install"
          npm init -y
          npm install --ignore-scripts \
            "$RUNNER_TEMP/agz-pack/vaur94-agz-memory-0.4.0.tgz" \
            "$RUNNER_TEMP/agz-pack/vaur94-agz-memory-plugin-0.4.0.tgz"
          npm audit --audit-level=moderate
          bun -e 'await import("@vaur94/agz-memory/core"); await import("@vaur94/agz-memory-plugin")'
