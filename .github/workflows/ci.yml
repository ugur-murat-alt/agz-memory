name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / minimum Bun
            os: ubuntu-latest
            bun: 1.3.14
          - name: Linux / current Bun
            os: ubuntu-latest
            bun: latest
          - name: macOS / current Bun
            os: macos-latest
            bun: latest
          - name: Windows / current Bun
            os: windows-latest
            bun: latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run release:verify
      - run: bun run check
      - run: bun run test
      - run: bun run build

  property-security:
    name: Property and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:property

  multiprocess-stress:
    name: Multiprocess stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:stress

  restore-faults:
    name: Restore fault tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:restore

  benchmark:
    name: Benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run benchmark:gate

  package-smoke:
    name: Packed install and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: mkdir -p "$RUNNER_TEMP/agz-pack"
      - run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/agz-pack"
      - run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/agz-pack"
        working-directory: packages/opencode-plugin
      - name: Install packed packages together
        run: |
          VERSION="$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).version)')"
          CORE_TARBALL="$RUNNER_TEMP/agz-pack/vaur94-agz-memory-${VERSION}.tgz"
          PLUGIN_TARBALL="$RUNNER_TEMP/agz-pack/vaur94-agz-memory-plugin-${VERSION}.tgz"
          test -f "$CORE_TARBALL"
          test -f "$PLUGIN_TARBALL"
          mkdir -p "$RUNNER_TEMP/agz-install"
          cd "$RUNNER_TEMP/agz-install"
          npm init -y
          npm install --ignore-scripts "$CORE_TARBALL" "$PLUGIN_TARBALL"
          npm audit --audit-level=moderate
          bun -e 'await import("@vaur94/agz-memory/core"); await import("@vaur94/agz-memory-plugin")'
          bun -e 'const c=await Bun.file("node_modules/@vaur94/agz-memory/skills/index.json").json(); const s=await Bun.file("node_modules/@vaur94/agz-memory/skills/agz-memory/agz-memory.md").text(); const v=(await Bun.file("node_modules/@vaur94/agz-memory/package.json").json()).version; if(Object.keys(c).join()!=="skills"||c.skills?.length!==1||Object.keys(c.skills[0]).sort().join()!=="files,name,version"||c.skills[0]?.version!==v||!s.startsWith("---\nname: AGZ Memory\ndescription: Use project-scoped")||!s.includes("\nslash: false\n---\n")) throw new Error("invalid packaged skill catalog")'
          bun "$GITHUB_WORKSPACE/scripts/verify-packed-mcp.ts" \
            "$RUNNER_TEMP/agz-install/node_modules/@vaur94/agz-memory/dist/server.js" \
            "$RUNNER_TEMP/agz-install/mcp.sqlite" "$VERSION"
          OPENCODE_MEMORY_DATABASE_PATH="$RUNNER_TEMP/agz-install/mcp.sqlite" \
            ./node_modules/.bin/agz-memory-admin doctor > doctor.json
          bun -e 'const r=await Bun.file("doctor.json").json(); if(!r.ok||r.health?.schemaVersion!==11) throw new Error("invalid packaged doctor")'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
