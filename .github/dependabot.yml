version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This SDK is compatibility-locked to the exact OpenCode V2 runtime.
      # Upgrade it manually with the runtime constant and integration tests.
      - dependency-name: "@opencode-ai/plugin"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /packages/opencode-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This SDK is compatibility-locked to the exact OpenCode V2 runtime.
      # Upgrade it manually with the runtime constant and integration tests.
      - dependency-name: "@opencode-ai/plugin"
